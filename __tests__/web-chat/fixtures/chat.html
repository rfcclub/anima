<!doctype html><meta charset="utf-8"><main id="thread"></main><textarea id="editor"></textarea><button id="send">Send</button>
<script>
const params=new URLSearchParams(location.search),thread=document.querySelector('#thread');let draft='';
if(params.has('editable')){const old=document.querySelector('#editor'),editor=document.createElement('div');editor.id='editor';editor.contentEditable='true';editor.style.whiteSpace='pre-wrap';if(params.get('editable')==='paragraph')editor.innerHTML='<p><br></p>';old.replaceWith(editor);editor.addEventListener('input',event=>{draft+=event.data??'\n';});if(params.has('strip-newlines'))editor.addEventListener('input',()=>{editor.textContent=editor.innerText.replace(/\n/g,'');});}
if(params.has('state')){const marker=document.createElement('div');marker.className=params.get('state');document.body.append(marker);}
function turn(role,text,state='completed'){const el=document.createElement('article');el.className=role;el.dataset.id=crypto.randomUUID();el.dataset.state=state;el.style.whiteSpace='pre-wrap';if(role==='assistant'){const thought=document.createElement('aside');thought.textContent='private thinking';el.append(thought);const answer=document.createElement('div');answer.className='answer';answer.textContent=text;el.append(answer);}else el.textContent=text;thread.append(el);return el;}
if(params.has('stale')){turn('user','old question');turn('assistant','OLD ANSWER');}
document.querySelector('#send').onclick=()=>{const editor=document.querySelector('#editor'),prompt=editor instanceof HTMLTextAreaElement?editor.value:draft;draft='';if(editor instanceof HTMLTextAreaElement)editor.value='';else editor.textContent='';turn('user',prompt);if(params.has('break'))return;const answer=turn('assistant','', 'generating');setTimeout(()=>{answer.querySelector('.answer').textContent=params.has('echo')?prompt:(params.get('answer')??'OK');if(!params.has('no-final'))answer.dataset.state='completed';},Number(params.get('delay')??60));};
</script>
